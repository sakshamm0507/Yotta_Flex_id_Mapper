[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idmap"
version = "1.0.0"
description = "Deterministic ID mapping pipeline: source identifiers to canonical IDs with history, conflicts and reconciliation"
readme = "README.md"
authors = [{ name = "Saksham Mehrotra", email = "mehrotrasaksham0507@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.4", "PyYAML==6.0.3", "click==8.1.8"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.3.0"]

[project.scripts]
idmap = "idmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
